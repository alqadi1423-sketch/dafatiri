# نشر «دفاتري» على Cloudflare: يعمل عند كل رفع إلى main، ويدويًا من تبويب Actions.
# الأسرار (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, OWNER_EMAIL
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - name: التحقق من الأسرار
        run: |
          missing=""
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID OWNER_EMAIL; do [ -n "${!n:-}" ] || missing="$missing $n"; done
          if [ -n "$missing" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then echo "::notice::لم تُضبط الأسرار بعد:$missing. النشر متوقف حتى تُضاف."; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0; fi
            echo "::error::أسرار ناقصة:$missing"; exit 1
          fi

      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: 22

      - name: تثبيت الأدوات
        if: env.SKIP != '1'
        run: npm ci

      - name: الاختبارات
        if: env.SKIP != '1'
        run: npm test

      - name: تجهيز Cloudflare
        if: env.SKIP != '1'
        run: bash scripts/cf-setup.sh

      - name: ترحيلات قاعدة البيانات
        if: env.SKIP != '1'
        run: npx wrangler d1 migrations apply dafatiri --remote

      - name: نشر الموقع
        if: env.SKIP != '1'
        run: npx wrangler pages deploy --project-name dafatiri --branch main --commit-dirty=true

      - name: الرابط
        if: env.SKIP != '1'
        run: echo "### الموقع: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
