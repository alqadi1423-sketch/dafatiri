# تعديل البيانات مباشرة في قاعدة البيانات، يدويًا من تبويب Actions.
# الأوامر تُكتب في خانة الإدخال عند التشغيل، فلا تُحفظ أي بيانات في الكود.
name: sql

on:
  workflow_dispatch:
    inputs:
      sql:
        description: أوامر SQL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: تجهيز
        run: bash scripts/cf-setup.sh > /dev/null
      - name: التنفيذ
        env:
          SQL: ${{ inputs.sql }}
        run: |
          printf '%s\n' "$SQL" > /tmp/run.sql
          npx wrangler d1 execute dafatiri --remote --command "$(cat /tmp/run.sql)" --json > /tmp/out.json 2> /tmp/err.txt || { tail -20 /tmp/err.txt /tmp/out.json; exit 1; }
          # يطبع نتيجة آخر استعلام فقط (للأعداد والتحقق)
          jq -c '.[-1].results' /tmp/out.json
          rm -f /tmp/run.sql /tmp/out.json /tmp/err.txt
